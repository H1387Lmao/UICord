[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "uicord"
version = "4.0.6"
description = "Components V2 helper for Discord bots"
requires-python = ">=3.10"
dependencies = ["py-cord>=2.7"]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/yourusername/uicord"
Repository = "https://github.com/yourusername/uicord"
BugTracker = "https://github.com/yourusername/uicord/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
uicord = { workspace = true }

[dependency-groups]
dev = [
    "uicord",
]

