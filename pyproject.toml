[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "UICord"
version = "3.1.5"
description = "Components V2 helper for Discord bots"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
uicord = { workspace = true }

[dependency-groups]
dev = [
    "uicord",
]
